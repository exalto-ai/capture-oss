[package]
name = "undertext-capture-python"
version = "0.0.1"
edition = "2024"
license = "MIT"
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
anyhow = "1.0"
undertext-capture = { path = "../rust" }
http = "1.5"
pyo3 = { version = "0.30.1", features = ["abi3-py311"] }
tokio = { version = "1.54", features = ["rt-multi-thread"] }

# The runtime workspace's lints (oss/Cargo.toml); oss/clippy.toml applies here.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
allow_attributes_without_reason = "warn"
dbg_macro = "warn"
print_stderr = "warn"
print_stdout = "warn"
unwrap_used = "warn"

# Its own workspace, so the runtime workspace never builds a Python extension.
[workspace]

# Keep the runtime workspace's TLSNotary patch and dependency optimization.
[patch."https://github.com/tlsnotary/tlsn-utils"]
spansy = { path = "../../vendor/tlsn-utils/spansy" }

[profile.dev.package."*"]
opt-level = 1
