[package]
name = "exalto-capture-python"
version = "0.0.1"
edition = "2024"
license = "MIT"
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
anyhow = "1.0"
exalto-capture = { path = "../rust" }
http = "1.3"
pyo3 = { version = "0.30.1", features = ["abi3-py310"] }
tokio = { version = "1.45", features = ["rt-multi-thread"] }

# Its own workspace, so the runtime workspace never builds a Python extension.
[workspace]

# Keep the runtime workspace's TLSNotary patch and dependency optimization.
[patch."https://github.com/tlsnotary/tlsn-utils"]
spansy = { path = "../../vendor/tlsn-utils/spansy" }

[profile.dev.package."*"]
opt-level = 1
