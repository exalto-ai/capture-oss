[build-system]
requires = ["maturin>=1.16,<2"]
build-backend = "maturin"

[project]
name = "undertext-capture"
version = "0.0.1"
description = "Seal model-provider calls with an Undertext Capture notary and get the evidence back as bytes"
license = "MIT"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
httpx2 = ["httpx2>=2.7", "anyio>=4.10"]

[tool.maturin]
python-source = "python"
module-name = "undertext_capture._native"
features = ["pyo3/extension-module"]
