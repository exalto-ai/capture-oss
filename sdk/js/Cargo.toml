[package]
name = "exalto-capture-node"
version = "0.0.1"
edition = "2024"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
anyhow = "1.0"
exalto-capture = { path = "../rust" }
http = "1.3"
napi = { version = "3.16.1", default-features = false, features = ["napi8", "async"] }
napi-derive = "3.7.0"
tokio = { version = "1.45", features = ["rt-multi-thread", "sync"] }

[build-dependencies]
napi-build = "2.6.0"

# Its own workspace, so the runtime workspace never builds a Node addon.
[workspace]

# Keep the runtime workspace's TLSNotary patch and dependency optimization.
[patch."https://github.com/tlsnotary/tlsn-utils"]
spansy = { path = "../../vendor/tlsn-utils/spansy" }

[profile.dev.package."*"]
opt-level = 1
