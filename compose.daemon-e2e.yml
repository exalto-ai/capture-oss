services:
  setup:
    image: ${DAEMON_E2E_IMAGE:-capture-server-e2e:local}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        umask 077
        mkdir -p /state/secrets
        mkdir -p /fixtures
        if ! test -f /state/secrets/cluster-vault.key; then
          openssl rand 32 > /state/secrets/cluster-vault.key
        fi
        if ! test -f /fixtures/ca.der; then
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out /fixtures/ca.key
          openssl req -x509 -new -key /fixtures/ca.key -sha256 -days 2 \
            -subj /CN=Notary-Daemon-E2E-Root \
            -addext basicConstraints=critical,CA:TRUE \
            -addext keyUsage=critical,keyCertSign,cRLSign \
            -out /fixtures/ca.pem
          openssl x509 -in /fixtures/ca.pem -outform DER -out /fixtures/ca.der
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out /fixtures/server.key
          openssl req -new -key /fixtures/server.key \
            -subj /CN=api.openai.com -out /fixtures/server.csr
          printf '%s\n' \
            'basicConstraints=critical,CA:FALSE' \
            'keyUsage=critical,digitalSignature,keyEncipherment' \
            'extendedKeyUsage=serverAuth' \
            'subjectAltName=DNS:api.openai.com' > /fixtures/server.ext
          openssl x509 -req -in /fixtures/server.csr \
            -CA /fixtures/ca.pem -CAkey /fixtures/ca.key -CAcreateserial \
            -sha256 -days 2 -extfile /fixtures/server.ext -out /fixtures/server.pem
        fi
        printf '%064d' 1 > /fixtures/notary-signing-key
        chmod 600 /fixtures/ca.key /fixtures/server.key /fixtures/notary-signing-key
        # Synthetic provider-request tokens, stored only as SHA-256 digests.
        # The admin routes still serve the default organization, so the
        # script's main token records for it.
        token_entry() {
          printf '[[tokens]]\nsha256 = "%s"\norganization = "%s"\n\n' \
            "$$(printf '%s' "$$1" | sha256sum | cut -d ' ' -f 1)" "$$2"
        }
        {
          token_entry e2e-capture-token default
          token_entry e2e-other-capture-token e2e-other
        } > /state/secrets/capture-tokens.toml
        cp /etc/capture/config-cluster-template.toml /state/config-cluster-a.toml
        cp /etc/capture/config-cluster-template.toml /state/config-cluster-b.toml
        chmod 600 /state/secrets/cluster-vault.key /state/secrets/capture-tokens.toml
        chmod 600 /state/config-cluster-a.toml /state/config-cluster-b.toml
    volumes:
      - daemon-state:/state
      - fixture-state:/fixtures
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: "no"

  postgres:
    image: postgres:17.7-alpine
    environment:
      POSTGRES_DB: daemon_e2e
      POSTGRES_PASSWORD: synthetic-daemon-e2e-password
      POSTGRES_USER: daemon_e2e
    volumes:
      - postgres-state:/var/lib/postgresql/data
    tmpfs:
      - /tmp
      - /run/postgresql
    security_opt:
      - no-new-privileges:true
    restart: "no"
    healthcheck:
      test: ["CMD", "pg_isready", "--username", "daemon_e2e", "--dbname", "daemon_e2e"]
      interval: 1s
      timeout: 2s
      retries: 30
      start_period: 2s

  object-store:
    image: chrislusf/seaweedfs:4.47
    # Run as the image's unprivileged seaweed account so the entrypoint does
    # not need root to fix /data ownership.
    user: "1000:1000"
    # Only the authenticated S3 API listens on the network; SeaweedFS's master,
    # volume, and filer APIs have no authentication, so they stay on loopback.
    command: ["server", "-s3", "-ip=127.0.0.1", "-ip.bind=127.0.0.1", "-s3.ip.bind=0.0.0.0", "-master.telemetry=false"]
    environment:
      AWS_ACCESS_KEY_ID: daemon-e2e-access-key
      AWS_SECRET_ACCESS_KEY: synthetic-daemon-e2e-secret-key
    volumes:
      - object-store-state:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: "no"
    # Healthy means SeaweedFS can store an object, not only that the S3 API
    # answers. After a restart the S3 API can serve reads well before the master
    # assigns a writable volume, so the first write was refused. /dir/assign
    # reserves a file ID in the bucket's collection and stores no data.
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --output /dev/null http://127.0.0.1:8333/healthz && curl --fail --silent --output /dev/null 'http://127.0.0.1:9333/dir/assign?collection=captured-e2e'"]
      interval: 1s
      timeout: 2s
      retries: 60
      start_period: 2s

  object-store-init:
    image: amazon/aws-cli:2.37.4
    depends_on:
      object-store:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        aws s3api head-bucket --bucket captured-e2e >/dev/null 2>&1 ||
          aws s3api create-bucket --bucket captured-e2e >/dev/null
    environment: &object-store-client-environment
      AWS_ENDPOINT_URL: http://object-store:8333
      AWS_ACCESS_KEY_ID: daemon-e2e-access-key
      AWS_SECRET_ACCESS_KEY: synthetic-daemon-e2e-secret-key
      AWS_DEFAULT_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: "true"
      HOME: /tmp
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: "no"

  object-store-client:
    image: amazon/aws-cli:2.37.4
    environment: *object-store-client-environment
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: "no"

  provider:
    image: ${DAEMON_E2E_IMAGE:-capture-server-e2e:local}
    depends_on:
      setup:
        condition: service_completed_successfully
    entrypoint: ["python3", "/usr/local/libexec/notary-e2e-provider.py"]
    volumes:
      - fixture-state:/fixtures:ro
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    restart: "no"
    networks:
      default:
        aliases:
          - api.openai.com
    healthcheck:
      test: ["CMD", "curl", "--noproxy", "*", "--fail", "--silent", "--show-error", "--resolve", "api.openai.com:443:127.0.0.1", "--cacert", "/fixtures/ca.pem", "https://api.openai.com/healthz"]
      interval: 1s
      timeout: 2s
      retries: 30
      start_period: 1s

  notary:
    image: ${DAEMON_E2E_IMAGE:-capture-server-e2e:local}
    depends_on:
      setup:
        condition: service_completed_successfully
      provider:
        condition: service_healthy
    entrypoint: ["notary-e2e-notary"]
    environment:
      CAPTURE_SERVER_E2E_ROOT_CA_DER: /fixtures/ca.der
      CAPTURE_SERVER_E2E_SIGNING_KEY_FILE: /fixtures/notary-signing-key
    volumes:
      - fixture-state:/fixtures:ro
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: "no"
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; socket.create_connection(('127.0.0.1', 7047), 1).close()"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 1s

  daemon-a:
    image: ${DAEMON_E2E_IMAGE:-capture-server-e2e:local}
    build:
      context: .
      dockerfile: Dockerfile
      target: daemon-e2e
    depends_on:
      setup:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      server-migrator:
        condition: service_completed_successfully
      object-store-init:
        condition: service_completed_successfully
      provider:
        condition: service_healthy
      notary:
        condition: service_healthy
    command: ["--config", "/state/config-cluster-a.toml"]
    environment:
      CAPTURE_SERVER_CLUSTER_INSTANCE_ID: daemon-a
      CAPTURE_SERVER_CLUSTER_VAULT_KEY_FILE: /state/secrets/cluster-vault.key
      CAPTURE_PLATFORM_API_ORIGIN: http://127.0.0.1:9797
      CAPTURE_SERVER_E2E_ROOT_CA_DER: /fixtures/ca.der
      CAPTURE_SERVER_E2E_PAUSE_AFTER_NOTARIZED_ARTIFACT_MS: ${DAEMON_E2E_SERVER_NOTARIZATION_PAUSE_MS:-0}
      CAPTURE_SERVER_METADATA_DATABASE_URL: postgresql://daemon_e2e:synthetic-daemon-e2e-password@postgres:5432/daemon_e2e
      CAPTURE_SERVER_ARTIFACT_S3_ACCESS_KEY_ID: daemon-e2e-access-key
      CAPTURE_SERVER_ARTIFACT_S3_SECRET_ACCESS_KEY: synthetic-daemon-e2e-secret-key
    volumes:
      - daemon-state:/state:ro
      - fixture-state:/fixtures:ro
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: "no"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8788/readyz"]
      interval: 1s
      timeout: 2s
      retries: 30
      start_period: 2s

  daemon-b:
    image: ${DAEMON_E2E_IMAGE:-capture-server-e2e:local}
    depends_on:
      setup:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      server-migrator:
        condition: service_completed_successfully
      object-store-init:
        condition: service_completed_successfully
      provider:
        condition: service_healthy
      notary:
        condition: service_healthy
    command: ["--config", "/state/config-cluster-b.toml"]
    environment:
      CAPTURE_SERVER_CLUSTER_INSTANCE_ID: daemon-b
      CAPTURE_SERVER_CLUSTER_VAULT_KEY_FILE: /state/secrets/cluster-vault.key
      CAPTURE_PLATFORM_API_ORIGIN: http://127.0.0.1:9797
      CAPTURE_SERVER_E2E_ROOT_CA_DER: /fixtures/ca.der
      CAPTURE_SERVER_E2E_PAUSE_AFTER_NOTARIZED_ARTIFACT_MS: ${DAEMON_E2E_SERVER_NOTARIZATION_PAUSE_MS:-0}
      CAPTURE_SERVER_METADATA_DATABASE_URL: postgresql://daemon_e2e:synthetic-daemon-e2e-password@postgres:5432/daemon_e2e
      CAPTURE_SERVER_ARTIFACT_S3_ACCESS_KEY_ID: daemon-e2e-access-key
      CAPTURE_SERVER_ARTIFACT_S3_SECRET_ACCESS_KEY: synthetic-daemon-e2e-secret-key
    volumes:
      - daemon-state:/state:ro
      - fixture-state:/fixtures:ro
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: "no"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8788/readyz"]
      interval: 1s
      timeout: 2s
      retries: 30
      start_period: 2s

  server-migrator:
    image: ${DAEMON_E2E_IMAGE:-capture-server-e2e:local}
    depends_on:
      setup:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    entrypoint: ["capture-server"]
    command: ["migrate", "--config", "/state/config-cluster-a.toml"]
    environment:
      CAPTURE_PLATFORM_API_ORIGIN: http://127.0.0.1:9797
      CAPTURE_SERVER_METADATA_MIGRATION_URL: postgresql://daemon_e2e:synthetic-daemon-e2e-password@postgres:5432/daemon_e2e
      CAPTURE_SERVER_CLUSTER_VAULT_KEY_FILE: /state/secrets/cluster-vault.key
    volumes:
      - daemon-state:/state:ro
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: "no"

  test-load-balancer:
    image: caddy:2.10-alpine
    depends_on:
      daemon-a:
        condition: service_healthy
      daemon-b:
        condition: service_healthy
    volumes:
      - ./deploy-daemon-e2e/load-balancer.Caddyfile:/etc/caddy/Caddyfile:ro
    read_only: true
    tmpfs:
      - /config
      - /data
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    restart: "no"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8788/readyz"]
      interval: 1s
      timeout: 2s
      retries: 30
      start_period: 2s

volumes:
  daemon-state:
  fixture-state:
  object-store-state:
  postgres-state:

networks:
  default:
    internal: true
