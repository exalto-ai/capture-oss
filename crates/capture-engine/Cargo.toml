[package]
name = "capture-engine"
version.workspace = true
edition = "2024"
license = "MIT"
description = "Trace metadata and storage shared by Capture hosts"

[features]
# Lets the daemon Docker E2E target pause after storing a notarized package.
daemon-e2e = []
# Exposes the metadata and artifact store conformance suites to other crates'
# tests, so every store implementation runs the same contract.
test-support = []

[dependencies]
anyhow = { workspace = true }
axum = { workspace = true, features = ["macros"] }
async-trait = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
capture-core = { workspace = true, features = ["cli", "openapi"] }
hex = { workspace = true }
http = { workspace = true }
http-body-util = { workspace = true }
k256 = { workspace = true, features = ["ecdsa"] }
libc = { workspace = true }
reqwest = { workspace = true, features = ["rustls-tls", "stream"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true }
thiserror = "2.0"
tokio = { workspace = true, features = ["full"] }
tokio-stream = "0.1"
tracing = { workspace = true }
utoipa = { workspace = true, features = ["axum_extras", "uuid"] }
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
capture-core = { workspace = true, features = ["test-utils"] }
