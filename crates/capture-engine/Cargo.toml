[package]
name = "capture-engine"
version.workspace = true
edition = "2024"
license = "MIT"
description = "Trace metadata and storage shared by Capture hosts"

[features]
# Exposes the metadata and artifact store conformance suites to other crates'
# tests, so every store implementation runs the same contract.
test-support = []

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
capture-core = { workspace = true, features = ["openapi"] }
hex = { workspace = true }
libc = { workspace = true }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { workspace = true, features = ["derive"] }
sha2 = { workspace = true }
tempfile = { workspace = true }
thiserror = "2.0"
tokio = { workspace = true, features = ["full"] }
utoipa = { workspace = true, features = ["uuid"] }
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
capture-core = { workspace = true, features = ["test-utils"] }
