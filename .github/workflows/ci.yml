name: Public Runtime CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: public-runtime-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  runtime:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust toolchain from rust-toolchain.toml
        run: |
          rustup toolchain install --no-self-update
          rustup component add rustfmt clippy
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/admin-dashboard/package-lock.json
      - run: >-
          cargo fmt --check
          -p capture-core -p capture-engine -p capture-server -p capture
          -p capture-updater -p capture-notary
      - run: tooling/check-boundary.sh
      - run: python3 -m unittest tooling/test_check_boundary.py
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --locked --workspace --all-targets --all-features
      - run: npm --prefix apps/admin-dashboard ci
      - run: npm --prefix apps/admin-dashboard run build

  desktop:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust toolchain from rust-toolchain.toml
        run: |
          rustup toolchain install --no-self-update
          rustup component add clippy
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm --prefix apps/desktop ci
      - run: cargo clippy --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: npm --prefix apps/desktop exec -- tauri build --debug --bundles app -- --locked

  desktop-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install Tauri's Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev
      - name: Install Rust toolchain from rust-toolchain.toml
        run: |
          rustup toolchain install --no-self-update
          rustup component add clippy
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm --prefix apps/desktop ci
      - run: cargo clippy --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: npm --prefix apps/desktop exec -- tauri build --debug --no-bundle -- --locked

  gitleaks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan repository history
        uses: docker://ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
        with:
          args: dir --config=/github/workspace/.gitleaks.toml --redact --verbose /github/workspace
